name: LAB01 - Compilar informe final

"on":
  push:
    paths:
      - ".run-report"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar LaTeX
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-spanish texlive-publishers

      - name: Preparar figuras
        shell: bash
        run: |
          rm -rf report/figuras
          ln -s ../outputs/visualizaciones report/figuras

      - name: Compilar PDF
        shell: bash
        run: |
          cd report
          pdflatex -interaction=nonstopmode -halt-on-error LAB01_Informe_Final.tex
          pdflatex -interaction=nonstopmode -halt-on-error LAB01_Informe_Final.tex
          test -s LAB01_Informe_Final.pdf
          pdfinfo LAB01_Informe_Final.pdf | head -20 || true

      - name: Publicar PDF compilado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp report/LAB01_Informe_Final.pdf /tmp/LAB01_Informe_Final.pdf
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/LAB01_Informe_Final.pdf report/LAB01_Informe_Final.pdf
          git add -f report/LAB01_Informe_Final.pdf
          if git diff --cached --quiet; then
            echo "El PDF ya coincide con la versión actual."
          else
            git commit -m "report: compilar informe final"
            git push origin HEAD:main
          fi

      - name: Guardar informe como artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAB01-informe-final
          retention-days: 30
          path: |
            report/LAB01_Informe_Final.pdf
            report/LAB01_Informe_Final.tex
