name: Bootstrap LAB01 Retry
"on":
  push:
    paths:
      - ".run-bootstrap2"
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          cat .bootstrap/part_* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/lab01.tar.gz
          tar -xzf /tmp/lab01.tar.gz
          rm -rf .bootstrap .run-bootstrap .run-bootstrap2 .github/workflows/bootstrap.yml .github/workflows/bootstrap2.yml
      - name: Commit project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implementar laboratorio 01 completo"
          git push
