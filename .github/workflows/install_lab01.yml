name: Install LAB01 project
"on":
  push:
    paths:
      - ".run-install-lab01"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and validate package
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/part_* > /tmp/lab01.b64
          base64 -d /tmp/lab01.b64 > /tmp/lab01.zip
          unzip -t /tmp/lab01.zip
          unzip -o /tmp/lab01.zip -d .

      - name: Remove temporary bootstrap files
        shell: bash
        run: |
          rm -rf .upload .bootstrap .payload2
          rm -f .run-bootstrap .run-bootstrap2 .run-install-lab01
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/bootstrap2.yml
          rm -f .github/workflows/install_lab01.yml

      - name: Commit complete project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: cargar laboratorio 01 completo"
          git push
